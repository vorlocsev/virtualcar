; SectorV Virtual Car 0.2.5 - synthetic laboratory profile, NEVER a real VIN.
[Vehicle]
VIN=YV1CZ0002A0000001
BatteryMv=12500
; J2534 ISO15765 segmented RxStart indication (opt-in for compatibility A/B).
EmitIsoRxStart=1
ECUCount=2

[ECU0]
; Standard OBD/UDS ECM
RequestId=7E0
ResponseId=7E8
PartNumber=VIRTUAL-ECU
Software=SIM-1.0

[ECU1]
; P3 CEM addressing, F114 replies with synthetic VIN via UDS positive response 62 F1 14.
RequestId=726
ResponseId=72E
PartNumber=SIM-CEM
Software=SIM-CEM-1.0
; Optional read-only fixture bytes; leave empty until you have known-good data.
; Values are raw DID payload, WITHOUT the 62 F1 B0 / 62 F1 A3 header.
DIDF1B0Hex=
DIDF1A3Hex=

[D2_40]
; P2/P1 CEM address 40, response CAN ID is observed on some vehicles.
; Response frames must come from a verified fixture; do not invent B9 FB data.
ResponseId=00800003
B9FBFrameCount=0

[D2_50]
ResponseId=01000003
B9FBFrameCount=0
; To enable replay, supply B9FBFrameCount=N and B9FBFrame0=XX XX XX XX XX XX XX XX ...

[PassiveCAN]
; Off by default. Only synthetic lab traffic, NOT actual Volvo CAN frames.
Enabled=1
PeriodMs=50
FrameId=555
FrameData=56 43 41 52 4C 41 42 00
