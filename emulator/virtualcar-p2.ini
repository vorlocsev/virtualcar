; SectorV Virtual Car 0.3.0 | Volvo P2 MY2005+ diagnostic read-only profile.
; Source protocol: Volvo D2, NOT UDS P3. No real VIN or secret data bundled.
[Vehicle]
; Hardware marking on CEM case: H / L / Unknown (never CAN HS/LS)
CEMHardware=Unknown
; Independent diagnostic protocol: D2 / GGD / Unknown
CEMDiagnosticProtocol=Unknown
VIN=YV1CZ0002A0000001
BatteryMv=12500
EmitIsoRxStart=0
ECUCount=1

[ECU0]
RequestId=7E0
ResponseId=7E8
PartNumber=VIRTUAL-ECU
Software=SIM-1.0

[P2]
StrictRouting = 1
; Published DiCE captures show roughly 15 ms spacing between reply frames.
ReplaySpacingMs=12

[D2_40]
; CEM address 0x40 is observed on some low-speed P2 networks.
ResponseId=00800003
B9FBFrameCount=0

[D2_50]
; 2005-era DiCE B9FB capture uses 0x01200003 for multi-frame response.
; Paste a validated and appropriately redacted read-only session here.
ResponseId=01200003
B9FBFrameCount=0

[D2_40_B9F0]
ResponseId=00800003
FrameCount=0

[D2_50_B9F0]
ResponseId=01000003
FrameCount=0

[PassiveCAN]
; No fake ignition signal; only use verified P2 traces later.
Enabled=0
PeriodMs=50
FrameId=555
FrameData=56 43 41 52 4C 41 42 00

; v0.3.6 B9FC disabled unless verified FC140 frames are provided.
[D2_40_B9FC]
ResponseId = 00800003
FrameCount = 0

[D2_50_B9FC]
; ResponseId for FC has not been independently verified.
; This placeholder is not used unless FrameCount > 0.
ResponseId = 01200003
FrameCount = 0

; B3A308: original VIDA CEM config 241 — plain CAN/250000, D2 node 50.
; Disabled until a matching owner-attested response ID and exact frames exist.
; This is NOT the legacy 500k [D2_50] profile and not a donor VIN.
[D2_CEM50_250_B9FB]
Enabled=0
; Required when enabled: documented real ResponseId and B9FBFrameCount/frames.
ResponseId=
B9FBFrameCount=0
