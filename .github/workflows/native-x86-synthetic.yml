name: Native x86 synthetic CI
on:
  push:
    branches: [vc127-public-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'vorlocsev/virtualcar' && github.actor == 'vorlocsev' && github.ref == 'refs/heads/vc127-public-native'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native build and isolated tests
        shell: pwsh
        run: python native-release/native-ci/Run-NativeCI.py --source native-release
