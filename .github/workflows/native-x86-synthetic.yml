name: Native x86 synthetic CI
on:
  push:
    branches: [vc127-public-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'vorlocsev/virtualcar' && github.actor == 'vorlocsev' && github.ref == 'refs/heads/vc127-public-native'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native build and isolated tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not pass a PowerShell 7 or runner-customized module path to
          # Windows PowerShell 5.1 children. They reconstruct their defaults.
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          foreach ($relative in @('System32\WindowsPowerShell\v1.0\powershell.exe','SysWOW64\WindowsPowerShell\v1.0\powershell.exe')) {
            $child = Join-Path $env:WINDIR $relative
            if (-not (Test-Path -LiteralPath $child -PathType Leaf)) { throw 'Windows PowerShell missing' }
            & $child -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Get-Command Get-FileHash -ErrorAction Stop | Out-Null; Write-Output ("VC127C4_PS_PREFLIGHT=PASS " + $PSVersionTable.PSVersion + " bits=" + ([IntPtr]::Size * 8))'
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell module preflight failed' }
          }
          python native-release/native-ci/Run-NativeCI.py --source native-release
          if ($LASTEXITCODE -ne 0) { throw 'Native CI failed' }
