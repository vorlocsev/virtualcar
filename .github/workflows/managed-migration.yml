name: Virtual Car CSharp-Cpp Migration
on:
  pull_request:
    branches: [development]
    paths:
      - "emulator/managed/**"
      - "emulator/native-cpp/**"
      - ".github/workflows/managed-migration.yml"
  push:
    branches: [development]
    paths:
      - "emulator/managed/**"
      - "emulator/native-cpp/**"
      - ".github/workflows/managed-migration.yml"

permissions:
  contents: read

jobs:
  managed-linux-and-abi:
    name: NET10 core and Cpp20 ABI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build CSharp .NET 10 core and tests
        run: dotnet build emulator/managed/VirtualCar.Core.Checks/VirtualCar.Core.Checks.csproj -c Release
      - name: Eight managed synthetic lifecycle checks
        run: dotnet run --project emulator/managed/VirtualCar.Core.Checks/VirtualCar.Core.Checks.csproj -c Release --no-build
      - name: Build CSharp .NET 10 SQLite repository
        run: dotnet build emulator/managed/VirtualCar.Storage.Checks/VirtualCar.Storage.Checks.csproj -c Release
      - name: Eight managed actual SQLite integration checks
        run: dotnet run --project emulator/managed/VirtualCar.Storage.Checks/VirtualCar.Storage.Checks.csproj -c Release --no-build
      - name: Build CSharp M2 scenario compiler
        run: dotnet build emulator/managed/VirtualCar.Scenarios.Checks/VirtualCar.Scenarios.Checks.csproj -c Release
      - name: Eight real SQLite-to-scenario compiler gates
        run: dotnet run --project emulator/managed/VirtualCar.Scenarios.Checks/VirtualCar.Scenarios.Checks.csproj -c Release --no-build
      - name: Compile M5A bounded current-user Named Pipe host (Linux compile-only)
        run: dotnet build emulator/managed/VirtualCar.Service.Checks/VirtualCar.Service.Checks.csproj -c Release
      - name: Cross compile managed core and storage for Windows x64 (compile only)
        run: |
          dotnet build emulator/managed/VirtualCar.Core/VirtualCar.Core.csproj -c Release -r win-x64 --self-contained false
          dotnet build emulator/managed/VirtualCar.Storage/VirtualCar.Storage.csproj -c Release -r win-x64 --self-contained false
          dotnet build emulator/managed/VirtualCar.Scenarios/VirtualCar.Scenarios.csproj -c Release -r win-x64 --self-contained false
      - name: Cross compile M5A local IPC service for Windows x64 (compile only)
        run: dotnet build emulator/managed/VirtualCar.Service/VirtualCar.Service.csproj -c Release -r win-x64 --self-contained false
      - name: Compile and run C++20 J2534 ABI host contract
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I emulator/native-cpp/include \
              emulator/native-cpp/tests/j2534_abi_smoke.cpp -o /tmp/virtualcar-j2534-abi-smoke
          /tmp/virtualcar-j2534-abi-smoke
      - name: Eight standalone C++20 CAN and ISO-TP transport gates (host)
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I emulator/native-cpp/include \
              emulator/native-cpp/src/transport.cpp emulator/native-cpp/tests/transport_checks.cpp \
              -o /tmp/virtualcar-transport-checks
          /tmp/virtualcar-transport-checks
      - name: Eight J2534 ISO15765 RX metadata / multi-ECU tests (host)
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I emulator/native-cpp/include \
              emulator/native-cpp/src/isotp_rx.cpp emulator/native-cpp/tests/isotp_rx_checks.cpp \
              -o /tmp/virtualcar-isotp-rx-checks
          /tmp/virtualcar-isotp-rx-checks
  managed-windows:
    name: Windows .NET 10 core lifecycle smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Windows native-host .NET 10 synthetic checks
        shell: pwsh
        run: dotnet run --project emulator/managed/VirtualCar.Core.Checks/VirtualCar.Core.Checks.csproj -c Release
      - name: Windows native-host actual SQLite checks
        shell: pwsh
        run: dotnet run --project emulator/managed/VirtualCar.Storage.Checks/VirtualCar.Storage.Checks.csproj -c Release
      - name: Windows native-host M2 scenario compiler checks
        shell: pwsh
        run: dotnet run --project emulator/managed/VirtualCar.Scenarios.Checks/VirtualCar.Scenarios.Checks.csproj -c Release
      - name: Windows M5A local pipe authenticated session checks (8 groups)
        shell: pwsh
        run: dotnet run --project emulator/managed/VirtualCar.Service.Checks/VirtualCar.Service.Checks.csproj -c Release

  m3-native-abi:
    name: M3 native C++20 J2534 ABI (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    env:
      VC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure separate native Windows DLL and test executable
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP ("virtualcar-m3-" + $env:VC_ARCH)
          cmake -S emulator/native-cpp -B $buildDir -G "Visual Studio 17 2022" -A $env:VC_ARCH
          if ($LASTEXITCODE -ne 0) { throw 'CMake native J2534 configuration failed' }
      - name: Build private C++20 native DLL and exact-bitness test executable
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP ("virtualcar-m3-" + $env:VC_ARCH)
          cmake --build $buildDir --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native DLL or test executable failed to build' }
      - name: Verify PE machine and exactly 14 undecorated PassThru exports
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP ("virtualcar-m3-" + $env:VC_ARCH)
          $dll = Join-Path $buildDir 'Release/VirtualCarJ2534Cpp.dll'
          python emulator/native-cpp/tests/verify_pe_exports.py $dll $env:VC_ARCH
          if ($LASTEXITCODE -ne 0) { throw 'PE architecture/export contract failed' }
      - name: Execute J2534 ABI, M4A, M4B and M5B native checks in target bitness
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP ("virtualcar-m3-" + $env:VC_ARCH)
          ctest --test-dir $buildDir -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native J2534 ABI, M4A, M4B or M5B checks failed' }
      - name: Build C# M5A host for native C++ cross-language check
        shell: pwsh
        run: |
          dotnet build emulator/managed/VirtualCar.Service.Checks/VirtualCar.Service.Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'C# M5A host test build failed' }
      - name: Verify native C++ client against C# Host in target bitness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:RUNNER_TEMP ("virtualcar-m3-" + $env:VC_ARCH)
          $client = Join-Path $buildDir 'Release/vc_ipc_client_checks.exe'
          $serviceDll = Join-Path $env:GITHUB_WORKSPACE 'emulator/managed/VirtualCar.Service.Checks/bin/Release/net10.0/VirtualCar.Service.Checks.dll'
          if (-not (Test-Path -LiteralPath $client)) { throw "Native IPC client missing: $client" }
          if (-not (Test-Path -LiteralPath $serviceDll)) { throw "C# service checks missing: $serviceDll" }
          $rejectPipe = 'vcm5b-reject-' + $env:VC_ARCH.ToLowerInvariant() + '-' + [guid]::NewGuid().ToString('N')
          $rejectOut = Join-Path $env:RUNNER_TEMP 'm5b-reject.stdout.log'
          $rejectErr = Join-Path $env:RUNNER_TEMP 'm5b-reject.stderr.log'
          $rejectServer = $null
          try {
            $rejectServer = Start-Process -FilePath 'dotnet' -ArgumentList @($serviceDll, '--serve-once', $rejectPipe) -PassThru -WindowStyle Hidden -RedirectStandardOutput $rejectOut -RedirectStandardError $rejectErr
            $wrongPid = [uint32]($rejectServer.Id + 1)
            & $client --reject-peer $rejectPipe $wrongPid
            $rejectExit = $LASTEXITCODE
            if ($rejectExit -ne 0) { throw "C++ $env:VC_ARCH client did not reject wrong server PID (exit $rejectExit)" }
            if (-not $rejectServer.WaitForExit(10000)) { throw 'C# Host did not exit after rejected peer disconnect' }
            if ($rejectServer.ExitCode -ne 0) { throw "C# Host after peer rejection exited with code $($rejectServer.ExitCode)" }
          } finally {
            if ($null -ne $rejectServer -and -not $rejectServer.HasExited) {
              Stop-Process -Id $rejectServer.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $pipeName = 'vcm5b-' + $env:VC_ARCH.ToLowerInvariant() + '-' + [guid]::NewGuid().ToString('N')
          $stdout = Join-Path $env:RUNNER_TEMP 'm5b-host.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'm5b-host.stderr.log'
          $server = $null
          try {
            $server = Start-Process -FilePath 'dotnet' -ArgumentList @($serviceDll, '--serve-once', $pipeName) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            & $client --connect $pipeName $server.Id
            $clientExit = $LASTEXITCODE
            if ($clientExit -ne 0) { throw "C++ $env:VC_ARCH client failed with exit code $clientExit" }
            if (-not $server.WaitForExit(10000)) { throw 'C# Host did not exit after GOODBYE' }
            if ($server.ExitCode -ne 0) { throw "C# Host exited with code $($server.ExitCode)" }
            Write-Host "PASS: native C++ $env:VC_ARCH <-> C# Host HELLO/KEEPALIVE/GOODBYE"
          } finally {
            if ($null -ne $server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }
      # NO upload-artifact step: this intentionally NONFUNCTIONAL DLL is
      # never shipped or registered as a usable physical PassThru adapter.
