name: CEM50 PR isolated x86 J2534 validation

# This optional PR gate NEVER uses the persistent self-hosted VMware runner.
# The owner-only development push workflow remains the authoritative integration gate.
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/cem50-pr-validation.yml'
      - 'emulator/adapters/cem50/**'
      - 'emulator/tests/test_cem50_j2534_adapter.py'

permissions:
  contents: read
  actions: read

jobs:
  check-cem50:
    if: >-
      github.repository == 'vorlocsev/virtualcar' &&
      github.event.pull_request.head.repo.full_name == 'vorlocsev/virtualcar' &&
      github.event.pull_request.head.ref == 'feature/cem50-b9fb-j2534-20261121'
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Ensure expected development base and scope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne '${{ github.event.pull_request.head.sha }}') {
            throw 'PR HEAD mismatch'
          }
          if ('${{ github.event.pull_request.base.sha }}' -cne '9553d87d400f9baf80fa16fb4a30d163551a6bbb') {
            throw 'Development base changed; repin trusted DLL before running'
          }
          foreach ($p in @('emulator/adapters/cem50/virtualcar.ini',
                           'emulator/adapters/cem50/Verify-J2534CEM50.ps1',
                           'emulator/adapters/cem50/Install-J2534CEM50.ps1')) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing $p" }
          }

      - name: Setup Python for offline CEM50 tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run eleven exact-PR-head Python regressions
        shell: pwsh
        run: |
          python -m unittest discover -s emulator/tests -p test_cem50_j2534_adapter.py -v
          if ($LASTEXITCODE -ne 0) { throw 'CEM50 offline Python regressions failed' }

      - name: Parse both Windows PowerShell scripts (no execution of installer)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($s in @('emulator/adapters/cem50/Install-J2534CEM50.ps1',
                           'emulator/adapters/cem50/Verify-J2534CEM50.ps1')) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path -LiteralPath $s).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "Invalid Windows PowerShell syntax: $s"
            }
          }
          Write-Host 'PASS: installer and native smoke parse without errors'

      - name: Download pinned trusted development x86 LAB artifact (read only)
        uses: actions/download-artifact@v4
        with:
          name: virtualcar-vmware-lab-9553d87d400f9baf80fa16fb4a30d163551a6bbb-attempt-1
          run-id: 44669574171
          repository: vorlocsev/virtualcar
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cem50-pinned-artifact

      - name: Verify nested artifact ZIP, build source and exact x86 DLL SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'cem50-pinned-artifact'
          $package=Join-Path $root 'VirtualCar-VMware-LAB-ci-9553d87d400f-Windows-x86.zip'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw 'Expected pinned VMware ZIP missing'
          }
          $expectedPackage='45BF8F6E672272B64A18183B268484BF86DA65AB5B652384C2BE1FBE85ADC695'
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -cne $expectedPackage) {
            throw 'Pinned development LAB ZIP SHA256 mismatch'
          }
          $extract=Join-Path $env:RUNNER_TEMP 'cem50-source-dll'
          if (Test-Path -LiteralPath $extract) { throw 'Extraction folder already exists' }
          Expand-Archive -LiteralPath $package -DestinationPath $extract
          $lab=Join-Path $extract 'VirtualCar-VMware-LAB'
          $build=Get-Content -LiteralPath (Join-Path $lab 'BUILDINFO.json') -Raw | ConvertFrom-Json
          if ($build.source_commit -cne '9553d87d400f9baf80fa16fb4a30d163551a6bbb' -or
              $build.architecture -cne 'windows-x86-pe32') {
            throw 'Unexpected source commit or DLL platform'
          }
          $dll=Join-Path $lab 'VirtualCarJ2534.dll'
          $expectedDll='C636BAF8C66266BCA80009A2EFBC729F0D6DB00A3A7BE1384068F5E180F01528'
          if ((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash -cne $expectedDll) {
            throw 'Pinned J2534 DLL SHA256 mismatch'
          }
          Write-Host 'PASS: exact trusted development x86 PE32 DLL'

      - name: Run x86 J2534 CAN500 CEM50 B9FB 13 RX native smoke (no registry)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=Join-Path $env:RUNNER_TEMP 'cem50-source-dll/VirtualCar-VMware-LAB/VirtualCarJ2534.dll'
          $output=Join-Path $env:RUNNER_TEMP 'cem50-exact-native'
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'emulator/adapters/cem50/Verify-J2534CEM50.ps1' -DllPath $dll -ExpectedSha256 'C636BAF8C66266BCA80009A2EFBC729F0D6DB00A3A7BE1384068F5E180F01528' -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'Native CEM50 exact 13-frame regression failed' }
          $report=Get-Content -LiteralPath (Join-Path $output 'native-check.json') -Raw | ConvertFrom-Json
          if ($report.status -cne 'CEM50_NATIVE_PASS' -or
              $report.actual_matched_frame_count -ne 13 -or
              $report.published_vin -cne 'YV1CR855691511566' -or
              $report.vida_readvin_verified -ne $false -or
              $report.physical_adapter_used -ne $false) {
            throw 'Native CEM50 output contract mismatch'
          }
          Write-Host 'PASS: exact development DLL, published CEM50 profile, 13/13 frames'
          Write-Host 'VIDA ReadVin/ECU acceptance remains unverified'
