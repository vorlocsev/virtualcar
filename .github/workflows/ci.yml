name: Windows x86 cross-build and tests
on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - "cmd/**"
      - "trace_attribution/**"
      - "tests/**"
      - "scripts/**"
      - "build_dev26.sh"
      - "go.mod"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "proxy/**"
      - "cmd/**"
      - "trace_attribution/**"
      - "tests/**"
      - "scripts/**"
      - "build_dev26.sh"
      - "go.mod"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-proxy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld gcc file
      - name: Compile and test source
        run: bash build_dev26.sh
      - name: Inspect target format
        run: |
          file SectorV-Trace-OneClick-v0.3.6.7-dev26.exe cmd/oneclick/assets/VirtualCarTrace32.dll
          objdump -p cmd/oneclick/assets/VirtualCarTrace32.dll | grep -E 'DLL Name:|PassThru' | head -50
          test "$(objdump -p cmd/oneclick/assets/VirtualCarTrace32.dll | grep -c 'PassThru')" -eq 14
