name: Windows x86 cross-build and tests

# Legacy workflow name preserved for manual compatibility.
# This is now a guarded alias of the owner's single Windows self-hosted CI.
# All runs use trusted development source; no PR event or hosted runner.
# NEVER upload/publish a Virtual Car package, installer or prerelease.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-windows-validation:
    if: github.repository == 'vorlocsev/virtualcar' && github.actor == 'vorlocsev' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/vmware-development-validation.yml
    with:
      source_ref: development
    permissions:
      contents: read
