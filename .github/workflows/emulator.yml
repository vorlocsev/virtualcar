name: Virtual Car Emulator Windows x86
on:
  push:
    # Isolated CI for draft #43. No release workflow is enabled on this branch.
    branches: [main, experiment/can-ps-api-outcome-ab]
    paths: ["emulator/**", ".github/workflows/emulator.yml"]
  pull_request:
    branches: [main, development]
    paths: ["emulator/**", ".github/workflows/emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      VIRTUALCAR_ROUTE_EVIDENCE: /tmp/virtualcar-route-evidence.jsonl
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils gcc python3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: J2534 regression including READ128 and Vehicle Core
        run: gcc -std=c11 -O2 -Wall -Wextra -o /tmp/virtualcar_test tests/virtualcar_test.c src/p2core/p2_cem_router.c src/p2core/p2_ls_observer.c src/p2core/p2_vehicle_core.c src/p2core/p2_j2534_bridge.c && /tmp/virtualcar_test
      - name: Build Windows x86 J2534 DLL
        run: bash ./build-cross.sh
      - name: Validate architecture and PassThru exports
        run: |
          file VirtualCarJ2534.dll | grep 'PE32.*Intel i386'
          test "$(objdump -p VirtualCarJ2534.dll | grep -Ec '^\s*\[ *[0-9]+\].*PassThru[A-Za-z]+$')" -ge 14
          objdump -p VirtualCarJ2534.dll | grep 'DLL Name: KERNEL32.dll'
      - name: Python fixture and profile tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Go tests / vet
        run: cd control && go test ./... -count=1 && go vet ./...
      - name: Build Windows x86 GUI
        run: cd control && GOOS=windows GOARCH=386 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H windowsgui' -o ../VirtualCarControl.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-${{ github.sha }}-Windows-x86-LAB
          path: |
            emulator/VirtualCarJ2534.dll
            emulator/VirtualCarControl.exe
            emulator/virtualcar.ini
            emulator/virtualcar-default.ini
            emulator/virtualcar-p2.ini
            emulator/README_DEV28.md
            emulator/README_NATIVE_ROUTE_CHECK_RU.md
            emulator/tools/verify_native_routes.ps1
            emulator/tools/verify_native_routes.py
            emulator/tools/audit_backend_evidence.py

  native-routes:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VirtualCar-${{ github.sha }}-Windows-x86-LAB
          path: native-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual x86 DLL route regression in an isolated synthetic profile
        shell: pwsh
        run: |
          $dll = @(Get-ChildItem -LiteralPath native-input -Recurse -Filter VirtualCarJ2534.dll)
          if ($dll.Count -ne 1) { throw 'Expected exactly one built DLL' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-route-regression"
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 regression failed' }
          # Distinct isolated directory, baseline audits remain unaffected.
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_can_ps_api_outcome.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\can-ps-outcome-native"
          if ($LASTEXITCODE -ne 0) { throw 'Native CAN_PS A/B/C API-only regression failed' }
          python emulator/tools/verify_native_routes.py "$env:RUNNER_TEMP\native-route-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-route-regression-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native metadata audit failed' }
          python emulator/tools/audit_j2534_connect.py "$env:RUNNER_TEMP\native-route-regression\SectorVVirtualCar.log" --output "$env:RUNNER_TEMP\can-ps-config-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'CAN_PS config audit failed' }
          $configAudit = Get-Content -LiteralPath "$env:RUNNER_TEMP\can-ps-config-audit.json" -Raw | ConvertFrom-Json
          if ($configAudit.can_ps_config_probe.events -ne 9 -or $configAudit.can_ps_config_probe.invalid_events -ne 0) { throw 'Unexpected native CAN_PS metadata' }
          $rejected = $configAudit.rejected_can_ps_attempts
          if ($rejected.calls -ne 2 -or $rejected.invalid_events -ne 0 -or $rejected.outcome -ne 'rejected_not_transmitted') { throw 'Unexpected native rejected CAN_PS calls' }
          $attempt = @($rejected.categories | Where-Object origin -eq 'write_call')
          if ($attempt.Count -ne 1 -or $attempt[0].count -ne 1 -or $attempt[0].origin -ne 'write_call' -or $attempt[0].pins -ne 'pins_3_11' -or $attempt[0].message_protocol -ne 'CAN_PS' -or $attempt[0].shape -ne 'D2_40_B9FB' -or $attempt[0].inspection -ne 'inspected_raw_classic_can') { throw 'Unexpected rejected CAN_PS classification' }
          $periodAttempt = @($rejected.categories | Where-Object origin -eq 'periodic_registration_call')
          if ($periodAttempt.Count -ne 1 -or $periodAttempt[0].count -ne 1 -or $periodAttempt[0].pins -ne 'pins_3_11' -or $periodAttempt[0].message_protocol -ne 'CAN_PS' -or $periodAttempt[0].shape -ne 'D2_D8_unverified_prefix' -or $periodAttempt[0].inspection -ne 'inspected_raw_classic_can') { throw 'Unexpected rejected periodic shape' }
          $setup = $configAudit.can_ps_rejected_setup
          if ($setup.filter_calls -ne 1 -or $setup.periodic_registration_calls -ne 1 -or $setup.invalid_filter_events -ne 0 -or $setup.invalid_periodic_events -ne 0) { throw 'Unexpected native CAN_PS setup counts' }
          $filter = @($setup.filters)
          if ($filter.Count -ne 1 -or $filter[0].type -ne 'pass_filter' -or $filter[0].message_protocols -ne 'both_CAN_PS' -or $filter[0].sizes -ne 'both_id_only' -or $filter[0].flags -ne 'both_extended' -or $filter[0].flow -ne 'absent' -or $filter[0].mask -ne 'id_29_bits' -or $filter[0].pattern -ne '29_bit_range') { throw 'Unexpected native rejected filter arguments' }
          $period = @($setup.periodic)
          if ($period.Count -ne 1 -or $period[0].message_protocol -ne 'CAN_PS' -or $period[0].interval_ms -ne '4000' -or $period[0].interval_check -ne 'valid_catalog_interval') { throw 'Unexpected native rejected periodic arguments' }
      - name: Package synthetic CAN_PS A/B (no release)
        shell: pwsh
        run: |
          $dll = @(Get-ChildItem -LiteralPath native-input -Recurse -Filter VirtualCarJ2534.dll)
          if ($dll.Count -ne 1) { throw 'Expected exactly one tested x86 DLL' }
          $output = Join-Path $env:RUNNER_TEMP 'can-ps-ab-artifacts'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          python emulator/tools/package_can_ps_ab.py --root emulator --dll $dll[0].FullName --out-dir $output --source-sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'CAN_PS AB package validation failed' }
          $archives = @(Get-ChildItem -LiteralPath $output -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one four-mode LAB archive' }
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-CANPS-AB-${{ github.sha }}-Windows-x86-LAB
          path: |
            ${{ runner.temp }}/can-ps-ab-artifacts/*.zip
            ${{ runner.temp }}/can-ps-ab-artifacts/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-native-route-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-route-regression-audit.json
            ${{ runner.temp }}/can-ps-config-audit.json
          if-no-files-found: error


