name: Virtual Car Emulator Windows x86
on:
  push:
    branches: [main]
    paths: ["emulator/**", ".github/workflows/emulator.yml"]
  pull_request:
    branches: [main, development]
    paths: ["emulator/**", ".github/workflows/emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      VIRTUALCAR_ROUTE_EVIDENCE: /tmp/virtualcar-route-evidence.jsonl
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils gcc python3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: J2534 regression including READ128 and Vehicle Core
        run: gcc -std=c11 -O2 -Wall -Wextra -o /tmp/virtualcar_test tests/virtualcar_test.c src/p2core/p2_cem_router.c src/p2core/p2_ls_observer.c src/p2core/p2_vehicle_core.c src/p2core/p2_j2534_bridge.c && /tmp/virtualcar_test
      - name: Build Windows x86 J2534 DLL
        run: bash ./build-cross.sh
      - name: Validate architecture and PassThru exports
        run: |
          file VirtualCarJ2534.dll | grep 'PE32.*Intel i386'
          test "$(objdump -p VirtualCarJ2534.dll | grep -Ec '^\s*\[ *[0-9]+\].*PassThru[A-Za-z]+$')" -ge 14
          objdump -p VirtualCarJ2534.dll | grep 'DLL Name: KERNEL32.dll'
      - name: Python fixture and profile tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Donor B9FB identity coherence (synthetic static profile only)
        run: python3 tools/audit_p2_b9fb_coherence.py virtualcar-p2-b9fb-lab-vin.ini --expected-year 2009 --expected-type-code 275 --output b9fb-donor-coherence-safe.json
      - name: B9FB / B9F0 fixture source attribution (offline donor shapes only)
        run: |
          python3 tools/audit_p2_d2_fixture_provenance.py virtualcar-p2-b9fb-lab-vin.ini --output b9fb-fixture-source-safe.json
          python3 tools/audit_p2_d2_fixture_provenance.py virtualcar-p2-historical-demo.ini --output b9f0-fixture-source-safe.json
      - name: Go tests / vet
        run: cd control && go test ./... -count=1 && go vet ./...
      - name: Build Windows x86 GUI
        run: cd control && GOOS=windows GOARCH=386 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H windowsgui' -o ../VirtualCarControl.exe .
      - name: Stage user-facing real-client guide inside LAB root
        run: |
          mkdir -p docs/research
          cp ../docs/research/P2_REAL_CLIENT_CAPTURE_WORKFLOW_RU.md docs/research/P2_REAL_CLIENT_CAPTURE_WORKFLOW_RU.md
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-${{ github.sha }}-Windows-x86-LAB
          path: |
            emulator/VirtualCarJ2534.dll
            emulator/VirtualCarControl.exe
            emulator/virtualcar.ini
            emulator/virtualcar-default.ini
            emulator/virtualcar-p2.ini
            emulator/README_DEV28.md
            emulator/README_NATIVE_ROUTE_CHECK_RU.md
            emulator/README_CLIENT_CAPTURE_RU.md
            emulator/docs/research/P2_REAL_CLIENT_CAPTURE_WORKFLOW_RU.md
            emulator/scripts/install.ps1
            emulator/scripts/uninstall.ps1
            emulator/tools/verify_client_lab_bundle.py
            emulator/tools/verify_native_routes.ps1
            emulator/tools/verify_native_routes.py
            emulator/tools/audit_backend_evidence.py
            emulator/tools/audit_p2_b9fb_coherence.py
            emulator/tools/audit_p2_d2_fixture_provenance.py
            emulator/b9fb-donor-coherence-safe.json
            emulator/b9fb-fixture-source-safe.json
            emulator/b9f0-fixture-source-safe.json
            emulator/tools/prepare_p2_capture.py
            emulator/tools/audit_native_p2_channel_chronology.py
            emulator/tools/audit_d2_followup_window.py
            emulator/tools/audit_native_b9f0_response.py
            emulator/tools/verify_native_p2_p3_handoff.py
            emulator/tools/verify_native_p2_p3_handoff.ps1
            emulator/tools/prepare_p2_client_run.py
            emulator/tools/audit_native_j2534_lifecycle.py
            emulator/samples/p2-client-ui-observation.template.json
            emulator/scripts/diagnose.ps1
            emulator/scripts/Capture-P2ClientRun.ps1
            emulator/tools/audit_j2534_connect.py
            emulator/tools/audit_j2534_discovery.py
            emulator/tools/import_p2_trace.py

  native-routes:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VirtualCar-${{ github.sha }}-Windows-x86-LAB
          path: native-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual downloaded LAB ZIP layout and Windows scripts
        shell: pwsh
        run: |
          python emulator/tools/verify_client_lab_bundle.py native-input
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows x86 LAB ZIP readiness failed' }
          foreach ($relative in @(
              'scripts/install.ps1',
              'scripts/uninstall.ps1',
              'scripts/diagnose.ps1',
              'scripts/Capture-P2ClientRun.ps1')) {
            $file = Join-Path 'native-input' $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw 'Required packaged script missing'
            }
            $tokenStream = $null
            $parserErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokenStream, [ref]$parserErrors) | Out-Null
            if ($parserErrors.Count -gt 0) { throw 'Packaged Windows script syntax invalid' }
          }
      - name: Smoke-test packaged Begin and Finish using ephemeral Registry32 adapter
        shell: pwsh
        run: |
          # Disposable GitHub-hosted Windows runner only, with no real
          # diagnostic client and no native ECU. The installed key belongs
          # exclusively to the virtual adapter and is removed in finally.
          $root = (Resolve-Path -LiteralPath native-input).Path
          $keyName = 'SOFTWARE\PassThruSupport.04.04\SectorV Virtual Car'
          $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::LocalMachine,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            $existing = $base.OpenSubKey($keyName, $false)
            if ($null -ne $existing) {
              $existing.Close()
              throw 'Unexpected existing virtual adapter registry entry on disposable runner'
            }
          } finally { $base.Close() }
          $previousTemp = $env:TEMP
          $privateTemp = Join-Path $env:RUNNER_TEMP 'p2-private-empty-log'
          [void][IO.Directory]::CreateDirectory($privateTemp)
          $env:TEMP = $privateTemp
          $session = Join-Path $env:RUNNER_TEMP 'p2-packaged-begin-finish-test'
          try {
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\install.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'Packaged virtual J2534 registration failed' }
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\Capture-P2ClientRun.ps1') -Phase Begin -SessionDirectory $session
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Begin failed' }
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\Capture-P2ClientRun.ps1') -Phase Finish -SessionDirectory $session -IConfirmClientClosed
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Finish failed' }
            $safe = Join-Path $session 'SAFE-JSON-REPORTS'
            $files = @(Get-ChildItem -LiteralPath $safe -File)
            $note = Get-Content -LiteralPath (Join-Path $safe 'client-boundary.json') -Raw | ConvertFrom-Json
            if ($files.Count -ne 2 -or
                $note.diagnostic_focus -ne 'no_new_native_j2534_records_observed' -or
                $note.new_native_records_observed -ne $false -or
                $note.client_ecu_inventory_verified -ne $false) {
              throw 'Packaged Begin-Finish no-log result misclassified real client acceptance'
            }
          } finally {
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\uninstall.ps1')
            $env:TEMP = $previousTemp
          }
      - name: Actual x86 DLL route regression in an isolated synthetic profile
        shell: pwsh
        run: |
          # Validate PowerShell syntax before packaging a user-facing
          # read-only script. No registry edits or user-client launches.
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath emulator/scripts/Capture-P2ClientRun.ps1).Path,
            [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw 'Two-phase client capture PowerShell syntax gate failed'
          }
          $dll = @(Get-ChildItem -LiteralPath native-input -Recurse -Filter VirtualCarJ2534.dll)
          if ($dll.Count -ne 1) { throw 'Expected exactly one built DLL' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-route-regression"
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 regression failed' }
          python emulator/tools/verify_native_routes.py "$env:RUNNER_TEMP\native-route-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-route-regression-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native metadata audit failed' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_b9fb_a3.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-b9fb-a3-regression"
          if ($LASTEXITCODE -ne 0) { throw 'Native B9FB-to-A3 test failed' }
          python emulator/tools/verify_native_b9fb_a3.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-b9fb-a3-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native B9FB-to-A3 backend evidence failed' }
          # Independent x86 process and profile: historical donor-derived
          # LAB INI, with a synthetic VIN. Compare all 104 response bytes
          # against the selected configured fixture, not only D2 controls.
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_b9fb_a3.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-donor-b9fb-regression" -FixtureProfile emulator/virtualcar-p2-b9fb-lab-vin.ini
          if ($LASTEXITCODE -ne 0) { throw 'Native donor-derived B9FB byte-for-byte replay failed' }
          python emulator/tools/verify_native_b9fb_a3.py "$env:RUNNER_TEMP\native-donor-b9fb-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-donor-b9fb-a3-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native donor-derived B9FB backend audit failed' }
          # This raw log remains inside the temporary isolated test directory.
          # Only the allowlisted timing report is uploaded as an artifact.
          python emulator/tools/verify_native_d2_followup.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\SectorVVirtualCar.log" --output "$env:RUNNER_TEMP\native-b9fb-a3-timing.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native B9FB-to-A3 source-local timing audit failed' }
          # Preserve only anonymized J2534 channel aliases, never the raw trace.
          python emulator/tools/audit_native_p2_channel_chronology.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\SectorVVirtualCar.log" --output "$env:RUNNER_TEMP\native-p2-channel-chronology.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native P2 channel chronology audit failed' }
          python emulator/tools/verify_native_p2_first_a3.py "$env:RUNNER_TEMP\native-p2-channel-chronology.json" "$env:RUNNER_TEMP\native-b9fb-a3-timing.json" --output "$env:RUNNER_TEMP\native-first-a3-correlation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native first-A3 cross-report correlation failed' }
          # Generate three sanitized reports from the SAME raw native log.
          # The source log stays in RUNNER_TEMP and is never uploaded.
          python emulator/tools/prepare_p2_capture.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\SectorVVirtualCar.log" --output-dir "$env:RUNNER_TEMP\p2-synthetic-capture-safe"
          if ($LASTEXITCODE -ne 0) { throw 'Private-native capture preparation failed' }
          # One x86 DLL process performs the entire synthetic D2 B9FB -> B9F0
          # -> ISO15765 P3 F114 read. This is NOT a SectorV/VDASH client.
          # Keep the raw native log inside RUNNER_TEMP, upload safe JSON only.
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_p2_p3_handoff.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-p2-p3-handoff"
          if ($LASTEXITCODE -ne 0) { throw 'Single-process P2/P3 native x86 handoff failed' }
          # Re-run compiled x86 DLL in a NEW isolated process with the
          # importer's unverified mixed-source marker and explicit lock.
          # B9FB/B9F0 must remain silent; synthetic independent P3 still
          # answers. Raw logs remain private in RUNNER_TEMP.
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_p2_p3_handoff.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-composite-locked" -CompositeLocked
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 unapproved composite D2 replay guard failed' }
          $lockedNative = "$env:RUNNER_TEMP\native-composite-locked\SectorVVirtualCar.log"
          if (-not (Select-String -LiteralPath $lockedNative -SimpleMatch 'P2 unapproved composite D2 fixtures disabled (count, BE)' -Quiet)) {
            throw 'Native DLL did not report blocking composite D2 fixture replay'
          }
          python emulator/tools/prepare_p2_client_run.py $lockedNative --output-dir "$env:RUNNER_TEMP\native-composite-locked-safe"
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 composite-locked safe report preparation failed' }
          $lockedBoundary = Get-Content -LiteralPath "$env:RUNNER_TEMP\native-composite-locked-safe\client-boundary.json" -Raw | ConvertFrom-Json
          if ($lockedBoundary.b9fb_positive_transport_count -ne 0 -or
              $lockedBoundary.b9f0_positive_transport_count -ne 0 -or
              $lockedBoundary.direct_b9fb_b9f0_positive_transport_bound -ne $false -or
              $lockedBoundary.client_ecu_inventory_verified -ne $false) {
            throw 'Composite-locked native DLL fabricated D2 transport or ECU acceptance'
          }
          python emulator/tools/verify_native_p2_p3_handoff.py "$env:RUNNER_TEMP\native-p2-p3-handoff\SectorVVirtualCar.log" --output "$env:RUNNER_TEMP\native-p2-p3-handoff-gate.json"
          if ($LASTEXITCODE -ne 0) { throw 'P2/P3 same-native-process handoff provenance gate failed' }
          python emulator/tools/prepare_p2_capture.py "$env:RUNNER_TEMP\native-p2-p3-handoff\SectorVVirtualCar.log" --output-dir "$env:RUNNER_TEMP\p2-p3-handoff-safe"
          if ($LASTEXITCODE -ne 0) { throw 'P2/P3 native source redaction failed' }
          # Exercise the actual user-facing client capture report against
          # compiled x86 native DLL traffic. This remains a synthetic harness,
          # not an execution of SectorV or VDASH.
          python emulator/tools/prepare_p2_client_run.py "$env:RUNNER_TEMP\native-p2-p3-handoff\SectorVVirtualCar.log" --output-dir "$env:RUNNER_TEMP\p2-p3-client-boundary-safe"
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 client-boundary preparation failed' }
          $clientBoundary = Get-Content -LiteralPath "$env:RUNNER_TEMP\p2-p3-client-boundary-safe\client-boundary.json" -Raw | ConvertFrom-Json
          # An untrusted UI note about a NONEMPTY ECU list must NOT
          # override an explicitly unfinished scan, even when the
          # compiled DLL emits a full positive B9FB/B9F0/P3 chain.
          # The native host is PowerShell, not the proprietary client.
          $unfinishedUi = Join-Path $env:RUNNER_TEMP 'p2-unfinished-operator.json'
          @{
            format = 'virtualcar-p2-client-ui-observation-v1'
            client = 'sectorv'
            virtual_adapter_selected = $true
            scan_finished = $false
            vin_display = 'visible'
            ecu_list = 'nonempty'
            same_run_operator_attested = $true
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $unfinishedUi -Encoding utf8
          python emulator/tools/prepare_p2_client_run.py "$env:RUNNER_TEMP\native-p2-p3-handoff\SectorVVirtualCar.log" --ui $unfinishedUi --output-dir "$env:RUNNER_TEMP\p2-unfinished-client-safe"
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 unfinished UI capture failed' }
          $unfinished = Get-Content -LiteralPath "$env:RUNNER_TEMP\p2-unfinished-client-safe\client-boundary.json" -Raw | ConvertFrom-Json
          if ($unfinished.operator_inventory_observation_gate -ne 'client_scan_not_finished' -or
              $unfinished.operator_ecu_list_attributable_to_completed_scan -ne $false -or
              $unfinished.client_ecu_inventory_verified -ne $false -or
              $unfinished.first_p3_positive_transport_count -ne 1) {
            throw 'Native x86 incomplete client scan incorrectly credited with ECU inventory'
          }
          # The compiled x86 DLL must bind its direct B9FB->B9F0 request
          # to the positive B9F0 RX in the SAME closed native epoch.
          # This is transport evidence, not acceptance by SectorV/VDASH.
          $nativeSummary = Get-Content -LiteralPath "$env:RUNNER_TEMP\p2-p3-handoff-safe\capture-summary.json" -Raw | ConvertFrom-Json
          $binding = $nativeSummary.b9fb_to_b9f0_same_epoch_positive_binding
          if ($binding.status -ne 'direct_positive_b9f0_transport_same_native_epoch' -or
              $binding.direct_b9fb_to_b9f0_request_cross_audit_verified -ne $true -or
              $binding.positive_b9f0_transport_bound_to_direct_first_read -ne $true -or
              $binding.genuine_cem_identity_verified -ne $false -or
              $binding.client_b9f0_acceptance_verified -ne $false) {
            throw 'Native x86 direct B9FB-B9F0 positive transport binding gate failed'
          }
          if ($clientBoundary.direct_b9fb_b9f0_positive_transport_bound -ne $true -or
              $clientBoundary.client_ecu_inventory_verified -ne $false) {
            throw 'Native x86 client-boundary direct B9FB-B9F0 attribution failed'
          }
          if ($clientBoundary.native_device_lifecycle.status -ne 'single_closed_device_cycle' -or
              $clientBoundary.native_device_lifecycle.device_open_count -ne 1 -or
              $clientBoundary.native_device_lifecycle.device_close_count -ne 1 -or
              $clientBoundary.native_p2_single_closed_epoch -ne $true -or
              $clientBoundary.native_executable_label_family -ne 'unclassified_executable' -or
              $clientBoundary.operator_client_native_label_comparison -ne 'no_operator_client_reported' -or
              $clientBoundary.native_executable_identity_verified -ne $false -or
              $clientBoundary.client_ecu_inventory_verified -ne $false) {
            throw 'Native x86 client Open/Close single-cycle and no-client-verdict gate failed'
          }
          # A real compiled x86 DLL log with NO further appends must
          # yield an explicit absence-of-new-evidence report, not a claim
          # that SectorV ran or that any CEM identification was attempted.
          $completedNative = "$env:RUNNER_TEMP\native-p2-p3-handoff\SectorVVirtualCar.log"
          $oldLength = (Get-Item -LiteralPath $completedNative).Length
          $oldSha = (Get-FileHash -LiteralPath $completedNative -Algorithm SHA256).Hash.ToLowerInvariant()
          python emulator/tools/prepare_p2_client_run.py $completedNative --offset-bytes $oldLength --prefix-sha256 $oldSha --allow-empty-append --output-dir "$env:RUNNER_TEMP\p2-no-new-native-safe"
          if ($LASTEXITCODE -ne 0) { throw 'No-new-native-records safe reporter failed' }
          $negative = Get-Content -LiteralPath "$env:RUNNER_TEMP\p2-no-new-native-safe\client-boundary.json" -Raw | ConvertFrom-Json
          $negativeFiles = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\p2-no-new-native-safe" -File)
          if ($negative.diagnostic_focus -ne 'no_new_native_j2534_records_observed' -or
              $negative.new_native_records_observed -ne $false -or
              $negative.client_ecu_inventory_verified -ne $false -or
              $negativeFiles.Count -ne 2) {
            throw 'No-new-native-records report fabricated client discovery evidence'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-native-route-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-route-regression-audit.json
            ${{ runner.temp }}/native-b9fb-a3-audit.json
            ${{ runner.temp }}/native-donor-b9fb-a3-audit.json
            ${{ runner.temp }}/native-b9fb-a3-timing.json
            ${{ runner.temp }}/native-p2-channel-chronology.json
            ${{ runner.temp }}/native-first-a3-correlation.json
            ${{ runner.temp }}/p2-synthetic-capture-safe/*.json
            ${{ runner.temp }}/native-p2-p3-handoff-gate.json
            ${{ runner.temp }}/p2-p3-handoff-safe/*.json
            ${{ runner.temp }}/p2-p3-client-boundary-safe/*.json
            ${{ runner.temp }}/p2-unfinished-client-safe/*.json
            ${{ runner.temp }}/native-composite-locked-safe/*.json
            ${{ runner.temp }}/p2-no-new-native-safe/*.json
          if-no-files-found: error


