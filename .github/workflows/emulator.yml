name: Virtual Car Emulator Windows x86
on:
  push:
    branches: [main]
    paths: ["emulator/**", ".github/workflows/emulator.yml"]
  pull_request:
    branches: [main, development]
    paths: ["emulator/**", ".github/workflows/emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      VIRTUALCAR_ROUTE_EVIDENCE: /tmp/virtualcar-route-evidence.jsonl
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils gcc python3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: J2534 regression including READ128 and Vehicle Core
        run: gcc -std=c11 -O2 -Wall -Wextra -o /tmp/virtualcar_test tests/virtualcar_test.c src/p2core/p2_cem_router.c src/p2core/p2_ls_observer.c src/p2core/p2_vehicle_core.c src/p2core/p2_j2534_bridge.c && /tmp/virtualcar_test
      - name: Build Windows x86 J2534 DLL
        run: bash ./build-cross.sh
      - name: Validate architecture and PassThru exports
        run: |
          file VirtualCarJ2534.dll | grep 'PE32.*Intel i386'
          test "$(objdump -p VirtualCarJ2534.dll | grep -Ec '^\s*\[ *[0-9]+\].*PassThru[A-Za-z]+$')" -ge 14
          objdump -p VirtualCarJ2534.dll | grep 'DLL Name: KERNEL32.dll'
      - name: Python fixture and profile tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Donor B9FB identity coherence (synthetic static profile only)
        run: python3 tools/audit_p2_b9fb_coherence.py virtualcar-p2-b9fb-lab-vin.ini --expected-year 2009 --expected-type-code 275 --output b9fb-donor-coherence-safe.json
      - name: Go tests / vet
        run: cd control && go test ./... -count=1 && go vet ./...
      - name: Build Windows x86 GUI
        run: cd control && GOOS=windows GOARCH=386 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H windowsgui' -o ../VirtualCarControl.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-${{ github.sha }}-Windows-x86-LAB
          path: |
            emulator/VirtualCarJ2534.dll
            emulator/VirtualCarControl.exe
            emulator/virtualcar.ini
            emulator/virtualcar-default.ini
            emulator/virtualcar-p2.ini
            emulator/README_DEV28.md
            emulator/README_NATIVE_ROUTE_CHECK_RU.md
            emulator/tools/verify_native_routes.ps1
            emulator/tools/verify_native_routes.py
            emulator/tools/audit_backend_evidence.py
            emulator/tools/audit_p2_b9fb_coherence.py
            emulator/b9fb-donor-coherence-safe.json
            emulator/tools/prepare_p2_capture.py
            emulator/tools/audit_native_p2_channel_chronology.py
            emulator/tools/audit_d2_followup_window.py
            emulator/tools/audit_native_b9f0_response.py
            emulator/tools/audit_j2534_discovery.py
            emulator/tools/import_p2_trace.py

  native-routes:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VirtualCar-${{ github.sha }}-Windows-x86-LAB
          path: native-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual x86 DLL route regression in an isolated synthetic profile
        shell: pwsh
        run: |
          $dll = @(Get-ChildItem -LiteralPath native-input -Recurse -Filter VirtualCarJ2534.dll)
          if ($dll.Count -ne 1) { throw 'Expected exactly one built DLL' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-route-regression"
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 regression failed' }
          python emulator/tools/verify_native_routes.py "$env:RUNNER_TEMP\native-route-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-route-regression-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native metadata audit failed' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_b9fb_a3.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-b9fb-a3-regression"
          if ($LASTEXITCODE -ne 0) { throw 'Native B9FB-to-A3 test failed' }
          python emulator/tools/verify_native_b9fb_a3.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-b9fb-a3-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native B9FB-to-A3 backend evidence failed' }
          # Independent x86 process and profile: historical donor-derived
          # LAB INI, with a synthetic VIN. Compare all 104 response bytes
          # against the selected configured fixture, not only D2 controls.
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_b9fb_a3.ps1 -DllPath $dll[0].FullName -OutputDirectory "$env:RUNNER_TEMP\native-donor-b9fb-regression" -FixtureProfile emulator/virtualcar-p2-b9fb-lab-vin.ini
          if ($LASTEXITCODE -ne 0) { throw 'Native donor-derived B9FB byte-for-byte replay failed' }
          python emulator/tools/verify_native_b9fb_a3.py "$env:RUNNER_TEMP\native-donor-b9fb-regression\VirtualCar\dev47-backend.jsonl" --output "$env:RUNNER_TEMP\native-donor-b9fb-a3-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native donor-derived B9FB backend audit failed' }
          # This raw log remains inside the temporary isolated test directory.
          # Only the allowlisted timing report is uploaded as an artifact.
          python emulator/tools/verify_native_d2_followup.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\SectorVVirtualCar.log" --output "$env:RUNNER_TEMP\native-b9fb-a3-timing.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native B9FB-to-A3 source-local timing audit failed' }
          # Preserve only anonymized J2534 channel aliases, never the raw trace.
          python emulator/tools/audit_native_p2_channel_chronology.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\SectorVVirtualCar.log" --output "$env:RUNNER_TEMP\native-p2-channel-chronology.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native P2 channel chronology audit failed' }
          python emulator/tools/verify_native_p2_first_a3.py "$env:RUNNER_TEMP\native-p2-channel-chronology.json" "$env:RUNNER_TEMP\native-b9fb-a3-timing.json" --output "$env:RUNNER_TEMP\native-first-a3-correlation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native first-A3 cross-report correlation failed' }
          # Generate three sanitized reports from the SAME raw native log.
          # The source log stays in RUNNER_TEMP and is never uploaded.
          python emulator/tools/prepare_p2_capture.py "$env:RUNNER_TEMP\native-b9fb-a3-regression\SectorVVirtualCar.log" --output-dir "$env:RUNNER_TEMP\p2-synthetic-capture-safe"
          if ($LASTEXITCODE -ne 0) { throw 'Private-native capture preparation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualCar-native-route-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-route-regression-audit.json
            ${{ runner.temp }}/native-b9fb-a3-audit.json
            ${{ runner.temp }}/native-donor-b9fb-a3-audit.json
            ${{ runner.temp }}/native-b9fb-a3-timing.json
            ${{ runner.temp }}/native-p2-channel-chronology.json
            ${{ runner.temp }}/native-first-a3-correlation.json
            ${{ runner.temp }}/p2-synthetic-capture-safe/*.json
          if-no-files-found: error


