name: Virtual Car VMware runner connectivity

# Explicitly manual, private repository only.
# Does not checkout source, run PR code, publish files, or access vehicle data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    name: Windows self-hosted runner connection
    if: github.repository == 'vorlocsev/virtualcar'
    runs-on: [self-hosted, Windows, X64, virtualcar-win]
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify connected Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
              throw 'Unexpected runner OS'
          }

          Write-Host 'Virtual Car VMware Runner connected.'
          Write-Host ('Windows version: ' + [System.Environment]::OSVersion.Version.ToString())
          Write-Host ('Architecture: ' + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)

          # Check commands visible to the service account without revealing paths.
          foreach ($tool in @('git', 'go', 'dotnet', 'python', 'cmake')) {
              $cmd = Get-Command $tool -ErrorAction SilentlyContinue
              if ($cmd) {
                  Write-Host ('AVAILABLE: ' + $tool)
              } else {
                  throw ('Required tool missing from job PATH: ' + $tool)
              }
          }

          python --version
          python -c "import sqlite3; print('SQLite ' + sqlite3.sqlite_version)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs2022 = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs2022)) { throw 'Visual Studio 2022 Build Tools not visible to runner' }
          Write-Host ('Visual Studio 2022: ' + $vs2022)

          $cmakeHelp = cmake --help | Out-String
          if ($cmakeHelp -notmatch 'Visual Studio 17 2022') { throw 'CMake Visual Studio 17 2022 generator is unavailable' }
          Write-Host 'CMake VS 2022 generator: AVAILABLE'

          Write-Host 'Connection and toolchain smoke PASS. No artifacts or releases produced.'
