name: Virtual Car VMware development validation

# One authoritative owner-only Windows self-hosted CI implementation.
# Trusted development pushes run automatically. Manual dispatch and calls
# from legacy-named wrappers must originate at main, then checkout a trusted
# source ref. NEVER run untrusted pull_request code on the persistent VM.
# All old hosted runners have been retired; no artifacts or releases.
on:
  push:
    branches: [development]
    paths:
      - "emulator/**"
      - "proxy/**"
      - "cmd/**"
      - "trace_attribution/**"
      - "tests/**"
      - "scripts/**"
      - "dotnet/**"
      - "build_dev26.sh"
      - ".github/workflows/**"
      - "NuGet.Config"
      - "global.json"
      - "go.mod"
      - "go.sum"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_call:
    inputs:
      source_ref:
        description: "Owner-selected trusted source ref"
        required: false
        type: string
        default: development
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Trusted source branch to validate on the private VMware runner"
        required: true
        type: choice
        default: development
        options:
          - development
          - feature/m5a-secure-local-ipc-preflight
          - feature/sqlite-10gb-vmware-runner
          - feature/m5b-cpp-named-pipe-client
          - feature/m5c1-bounded-lifecycle-preflight

permissions:
  contents: read

concurrency:
  group: virtualcar-vmware-development-validation
  cancel-in-progress: false

jobs:
  validate-development:
    name: Development Python, Go, C++ and .NET gates
    if: github.repository == 'vorlocsev/virtualcar' && github.actor == 'vorlocsev' && ((github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, Windows, X64, virtualcar-win]
    timeout-minutes: 60

    steps:
      - name: Checkout selected trusted source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'development' }}
          persist-credentials: false

      - name: Verify local toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ('Source commit: ' + (git rev-parse HEAD))
          Write-Host ('Runner: ' + $env:RUNNER_NAME)
          Write-Host ('OS: ' + [System.Environment]::OSVersion.Version)
          Write-Host ('Architecture: ' + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)

          $pythonManifest = 'E:\VirtualCar\Tools\python312.path'
          if (-not (Test-Path -LiteralPath $pythonManifest)) { throw 'Python manifest is missing' }
          $python = (Get-Content -LiteralPath $pythonManifest -Raw).Trim()
          if (-not (Test-Path -LiteralPath $python)) { throw "Python not found: $python" }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 failed' }
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) { throw 'pip is unavailable' }

          $goVersion = go version
          Write-Host $goVersion
          if ($LASTEXITCODE -ne 0) { throw 'Go is unavailable' }

          $dotnetSdks = dotnet --list-sdks | Out-String
          Write-Host $dotnetSdks
          if ($dotnetSdks -notmatch '10\.0\.') { throw '.NET 10 SDK is not installed for the runner service' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs2022 = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs2022)) { throw 'Visual Studio 2022 Build Tools not found' }
          Write-Host ('Visual Studio 2022: ' + $vs2022)

          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is unavailable' }

      - name: Run complete Python emulator test suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python -m unittest discover -s emulator/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python emulator test suite failed' }

      - name: Verify LLVM and Git Bash for legacy x86 build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('clang','lld-link','bash','llvm-readobj')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "Required tool is missing from Runner PATH: $tool" }
            Write-Host ("AVAILABLE: {0} => {1}" -f $tool,$cmd.Source)
          }
          clang --version
          if ($LASTEXITCODE -ne 0) { throw 'Clang is not executable' }
          lld-link --version
          if ($LASTEXITCODE -ne 0) { throw 'LLD-Link is not executable' }

      - name: Run legacy C protocol regression with Clang host compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testExe = Join-Path $env:RUNNER_TEMP 'virtualcar-c-host-tests.exe'
          $env:VIRTUALCAR_ROUTE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'virtualcar-c-host-route-evidence.jsonl'
          clang -std=c11 -O2 -Wall -Wextra -D_CRT_SECURE_NO_WARNINGS -o $testExe emulator/tests/virtualcar_test.c emulator/src/p2core/p2_cem_router.c emulator/src/p2core/p2_ls_observer.c emulator/src/p2core/p2_vehicle_core.c emulator/src/p2core/p2_j2534_bridge.c
          if ($LASTEXITCODE -ne 0) { throw 'Legacy C host regression compilation failed' }
          & $testExe
          if ($LASTEXITCODE -ne 0) { throw 'Legacy C host regression failed' }

      - name: Cross-build legacy J2534 C DLL for Windows x86 with Clang and LLD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location emulator
          try {
            & bash ./build-cross.sh
            if ($LASTEXITCODE -ne 0) { throw 'Clang/LLD Windows x86 legacy DLL build failed' }
          } finally {
            Pop-Location
          }
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'Legacy x86 J2534 DLL was not produced' }
          llvm-readobj --coff-exports $dll
          if ($LASTEXITCODE -ne 0) { throw 'LLVM could not inspect the legacy x86 DLL export table' }
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python emulator/native-cpp/tests/verify_pe_exports.py $dll Win32
          if ($LASTEXITCODE -ne 0) { throw 'Legacy x86 DLL PE architecture/export verification failed' }

      - name: Run legacy C x86 DLL native route regression and evidence audit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $routeDir = Join-Path $env:RUNNER_TEMP 'virtualcar-native-route-regression'
          $audit = Join-Path $env:RUNNER_TEMP 'virtualcar-native-route-audit.json'
          if (Test-Path -LiteralPath $routeDir) { throw 'Refusing to reuse native route regression directory' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll -OutputDirectory $routeDir
          if ($LASTEXITCODE -ne 0) { throw 'Legacy x86 DLL native route regression failed' }
          $evidence = Join-Path $routeDir 'VirtualCar\dev47-backend.jsonl'
          if (-not (Test-Path -LiteralPath $evidence)) { throw 'Native route regression evidence is missing' }
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python emulator/tools/verify_native_routes.py $evidence --output $audit
          if ($LASTEXITCODE -ne 0) { throw 'Native route evidence audit failed' }

      - name: Run Go control tests and vet
        shell: powershell
        working-directory: emulator/control
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Go control tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }

      - name: Configure and build native C++ x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE '.ci-build\native-x86'
          cmake -S emulator/native-cpp -B $buildDir -G 'Visual Studio 17 2022' -A Win32
          if ($LASTEXITCODE -ne 0) { throw 'CMake x86 configuration failed' }
          cmake --build $buildDir --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'C++ x86 build failed' }
          ctest --test-dir $buildDir -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++ x86 CTest suite failed' }
          $parityExe = Join-Path $buildDir 'Release\vc_legacy_c_cpp_parity.exe'
          $legacyDll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $parityDir = Join-Path $env:RUNNER_TEMP 'virtualcar-m4b2-native-parity'
          if (-not (Test-Path -LiteralPath $legacyDll)) { throw 'Independently built legacy C x86 DLL is missing' }
          if (-not (Test-Path -LiteralPath $parityExe)) { throw 'C/C++ parity executable is missing' }
          if (Test-Path -LiteralPath $parityDir) { throw 'Refusing to reuse C/C++ parity directory' }
          & $parityExe $legacyDll $parityDir
          if ($LASTEXITCODE -ne 0) { throw 'Actual legacy C DLL versus C++20 RX parity failed' }

      - name: Configure and build native C++ x64
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE '.ci-build\native-x64'
          cmake -S emulator/native-cpp -B $buildDir -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake x64 configuration failed' }
          cmake --build $buildDir --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'C++ x64 build failed' }
          ctest --test-dir $buildDir -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++ x64 CTest suite failed' }

      - name: Run .NET 10 managed core checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project emulator/managed/VirtualCar.Core.Checks/VirtualCar.Core.Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw '.NET Core checks failed' }

      - name: Run .NET 10 SQLite storage checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project emulator/managed/VirtualCar.Storage.Checks/VirtualCar.Storage.Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw '.NET SQLite storage checks failed' }

      - name: Run .NET 10 scenario compiler checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project emulator/managed/VirtualCar.Scenarios.Checks/VirtualCar.Scenarios.Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw '.NET scenario compiler checks failed' }

      - name: Run M5A local IPC checks when present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'emulator/managed/VirtualCar.Service.Checks/VirtualCar.Service.Checks.csproj'
          if (Test-Path -LiteralPath $project) {
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { throw 'M5A local IPC integration checks failed' }
          } else {
            Write-Host 'SKIP: M5A service project is not present at this source ref.'
          }

      - name: Run M5B native C++ x86/x64 clients against C# Host when present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceDll = Join-Path $env:GITHUB_WORKSPACE 'emulator/managed/VirtualCar.Service.Checks/bin/Release/net10.0/VirtualCar.Service.Checks.dll'
          $clientX86 = Join-Path $env:GITHUB_WORKSPACE '.ci-build/native-x86/Release/vc_ipc_client_checks.exe'
          $clientX64 = Join-Path $env:GITHUB_WORKSPACE '.ci-build/native-x64/Release/vc_ipc_client_checks.exe'
          if (-not (Test-Path -LiteralPath $clientX86) -and -not (Test-Path -LiteralPath $clientX64)) {
            Write-Host 'SKIP: M5B native IPC client is not present at this source ref.'
            return
          }
          if (-not (Test-Path -LiteralPath $clientX86) -or -not (Test-Path -LiteralPath $clientX64)) {
            throw 'M5B requires both x86 and x64 native IPC clients.'
          }
          if (-not (Test-Path -LiteralPath $serviceDll)) {
            throw "M5B C# test host is missing: $serviceDll"
          }

          # Windows PowerShell 5.1 Start-Process -PassThru may expose an
          # empty ExitCode even after WaitForExit, causing a false failure.
          # Keep the original owning .NET Process handle and check ExitCode
          # only after an actual successful WaitForExit.
          function Start-M5BHost {
            param(
              [Parameter(Mandatory=$true)][string]$Dll,
              [Parameter(Mandatory=$true)][string]$PipeName,
              [Parameter(Mandatory=$true)][ValidateSet('session','no-session')][string]$Mode
            )
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = (Get-Command dotnet -ErrorAction Stop).Source
            $info.Arguments = ('"{0}" --serve-once "{1}" {2}' -f $Dll, $PipeName, $Mode)
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            # Child stdout/stderr are inherited so failure details remain in
            # the Actions log. Avoid unconsumed redirected pipes/deadlocks.
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $info
            if (-not $process.Start()) {
              $process.Dispose()
              throw "Could not start M5B C# host ($Mode)"
            }
            return $process
          }

          function Assert-M5BHostExit {
            param(
              [Parameter(Mandatory=$true)][System.Diagnostics.Process]$Process,
              [Parameter(Mandatory=$true)][string]$Label
            )
            if (-not $Process.WaitForExit(15000)) {
              throw "C# Host ($Label) did not terminate within deadline"
            }
            # ExitCode is a non-null Int32 from the retained Process handle.
            [int]$exitCode = $Process.ExitCode
            if ($exitCode -ne 0) {
              throw "C# Host ($Label) exited with code $exitCode"
            }
            Write-Host "PASS: C# Host ($Label) exited with code 0"
          }

          function Stop-M5BHost {
            param([System.Diagnostics.Process]$Process)
            if ($null -eq $Process) { return }
            try {
              if (-not $Process.HasExited) {
                $Process.Kill()
                [void]$Process.WaitForExit(5000)
              }
            } finally {
              $Process.Dispose()
            }
          }

          foreach ($arch in @('x86', 'x64')) {
            $client = if ($arch -eq 'x86') { $clientX86 } else { $clientX64 }

            $rejectPipe = 'vcm5b-reject-' + $arch + '-' + [guid]::NewGuid().ToString('N')
            $rejectServer = $null
            try {
              $rejectServer = Start-M5BHost -Dll $serviceDll -PipeName $rejectPipe -Mode 'no-session'
              $wrongPid = [uint32]($rejectServer.Id + 1)
              & $client --reject-peer $rejectPipe $wrongPid
              $rejectExit = $LASTEXITCODE
              if ($rejectExit -ne 0) {
                throw "C++ $arch client did not reject wrong server PID (exit $rejectExit)"
              }
              Assert-M5BHostExit -Process $rejectServer -Label "$arch wrong-PID rejection"
            } finally {
              Stop-M5BHost -Process $rejectServer
            }

            $pipeName = 'vcm5b-' + $arch + '-' + [guid]::NewGuid().ToString('N')
            $server = $null
            try {
              $server = Start-M5BHost -Dll $serviceDll -PipeName $pipeName -Mode 'session'
              & $client --connect $pipeName $server.Id
              $clientExit = $LASTEXITCODE
              if ($clientExit -ne 0) {
                throw "C++ $arch client failed with exit code $clientExit"
              }
              Assert-M5BHostExit -Process $server -Label "$arch HELLO/KEEPALIVE/GOODBYE"
              Write-Host "PASS: native C++ $arch <-> C# Host HELLO/KEEPALIVE/GOODBYE"
            } finally {
              Stop-M5BHost -Process $server
            }
          }

      - name: Validation summary
        if: success()
        shell: powershell
        run: |
          Write-Host ('Validated source ref: ' + '${{ inputs.source_ref || 'development' }}')
          Write-Host 'PASS: Python emulator tests'
          Write-Host 'PASS: legacy C host regression'
          Write-Host 'PASS: Clang/LLD legacy Windows x86 DLL build and PE export validation'
          Write-Host 'PASS: legacy x86 DLL native route regression and evidence audit'
          Write-Host 'PASS: Go control tests and vet'
          Write-Host 'PASS: Native C++ x86 configure/build/CTest and actual C/C++ parity'
          Write-Host 'PASS: Native C++ x64 configure/build/CTest'
          Write-Host 'PASS: .NET 10 core, SQLite storage and scenario checks'
          Write-Host 'M5A IPC and M5B cross-language checks run when the selected source contains the projects.'
          Write-Host 'No artifacts uploaded. No releases or deployments performed.'
