name: Virtual Car VMware development validation

# One authoritative owner-only Windows self-hosted CI implementation.
# Every development push runs automatically, without path exclusions.
# Manual dispatch and calls
# from legacy-named wrappers must originate at main, then checkout a trusted
# source ref. NEVER run untrusted pull_request code on the persistent VM.
# All old hosted runners have been retired; no artifacts or releases.
on:
  # Every owner-authored development push triggers full CI, including docs.
  push:
    branches: [development]
  workflow_call:
    inputs:
      source_ref:
        description: "Owner-selected trusted source ref"
        required: false
        type: string
        default: development
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Trusted source branch to validate on the private VMware runner"
        required: true
        type: choice
        default: development
        options:
          - development
          - feature/m5a-secure-local-ipc-preflight
          - feature/sqlite-10gb-vmware-runner
          - feature/m5b-cpp-named-pipe-client
          - feature/m5c1-bounded-lifecycle-preflight
          - feature/m5c2-authenticated-session-lifecycle
          - feature/m5d1-readonly-vcrd-contract
          - feature/m5d2a-csharp-synthetic-read-host
          - feature/m5d2b-native-readonly-ipc-client
          - feature/m5d2c-inflight-read-cancel-recovery
          - feature/m5d2d-synthetic-read-replay-stress
          - feature/m5d2ea-synthetic-reply-faults
          - feature/m5d2eb-offline-cancel-restart-races
          - feature/m5d2eb-host-three-epochs-x86-x64
          - feature/p0-sectorv-j2534-evidence-boundaries
          - feature/p0-b9fb-target50-evidence-guard
          - feature/p0-b9fb50-protocol-metadata-gate
          - feature/p0-explicit-a3-a6-unimplemented-evidence
          - research/vida-2015a-getscript-catalog-only-inspector
          - research/vida-readvin-script-selection-evidence
          - fix/vida-session-release-provenance-gate
          - feature/vida-readvin-xml-graph-safe-audit
          - feature/vida-jboss-startup-provenance-audit
          - research/vida-original-vinvalidator-ascii-shape-gate
          - fix/vida-getscript-nondbo-visibility

permissions:
  contents: read

concurrency:
  group: virtualcar-vmware-development-validation
  cancel-in-progress: false

jobs:
  validate-development:
    name: Development Python, Go, C++ and .NET gates
    if: github.repository == 'vorlocsev/virtualcar' && github.actor == 'vorlocsev' && ((github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, Windows, X64, virtualcar-win]
    timeout-minutes: 60

    steps:
      # Persistent self-hosted Windows runners may retain a sparse checkout
      # from older source refs. A git clean/reset can report success while the
      # subsequent checkout fails to replace tracked files. Start fresh, but
      # only inside this repository's exact disposable runner workspace.
      - name: Recreate isolated repository checkout on persistent VMware runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'vorlocsev/virtualcar') {
            throw 'Refusing to clean workspace for another repository'
          }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_WORKSPACE) -or
              [string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw 'Runner workspace variables are missing'
          }
          $actual = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $expected = [IO.Path]::GetFullPath(
            (Join-Path $env:RUNNER_WORKSPACE 'virtualcar')).TrimEnd('\')
          if (-not [String]::Equals($actual, $expected,
                  [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing to clean outside the expected Virtual Car checkout'
          }
          if (Test-Path -LiteralPath $actual) {
            Get-ChildItem -LiteralPath $actual -Force |
              ForEach-Object {
                Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop
              }
            if (@(Get-ChildItem -LiteralPath $actual -Force).Count -ne 0) {
              throw 'Runner checkout directory is not empty'
            }
          }

      - name: Checkout selected trusted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref || 'development' }}
          persist-credentials: false

      - name: Verify push checkout is the triggering immutable commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $actual = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) {
              throw 'Push validation checked out a different commit than the trigger'
            }
            if (-not (Test-Path -LiteralPath 'emulator/tests/test_audit_j2534_discovery.py')) {
              throw 'Checkout is incomplete: emulator test files missing'
            }
          }

      - name: Verify local toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ('Source commit: ' + (git rev-parse HEAD))
          Write-Host ('Runner: ' + $env:RUNNER_NAME)
          Write-Host ('OS: ' + [System.Environment]::OSVersion.Version)
          Write-Host ('Architecture: ' + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)

          $pythonManifest = 'E:\VirtualCar\Tools\python312.path'
          if (-not (Test-Path -LiteralPath $pythonManifest)) { throw 'Python manifest is missing' }
          $python = (Get-Content -LiteralPath $pythonManifest -Raw).Trim()
          if (-not (Test-Path -LiteralPath $python)) { throw "Python not found: $python" }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 failed' }
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) { throw 'pip is unavailable' }

          $goVersion = go version
          Write-Host $goVersion
          if ($LASTEXITCODE -ne 0) { throw 'Go is unavailable' }

          $dotnetSdks = dotnet --list-sdks | Out-String
          Write-Host $dotnetSdks
          if ($dotnetSdks -notmatch '10\.0\.') { throw '.NET 10 SDK is not installed for the runner service' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs2022 = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs2022)) { throw 'Visual Studio 2022 Build Tools not found' }
          Write-Host ('Visual Studio 2022: ' + $vs2022)

          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is unavailable' }

      - name: Run complete Python emulator test suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python -m unittest discover -s emulator/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python emulator test suite failed' }

      - name: Verify LLVM and Git Bash for legacy x86 build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('clang','lld-link','bash','llvm-readobj')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "Required tool is missing from Runner PATH: $tool" }
            Write-Host ("AVAILABLE: {0} => {1}" -f $tool,$cmd.Source)
          }
          clang --version
          if ($LASTEXITCODE -ne 0) { throw 'Clang is not executable' }
          lld-link --version
          if ($LASTEXITCODE -ne 0) { throw 'LLD-Link is not executable' }

      # Validate the original root proxy/ implementation as well as emulator/.
      # These checks are read-only; they do not load a vehicle DLL or contact
      # any adapter. Only owner-reviewed refs reach this persistent runner.
      - name: Test root dev26 J2534 RxStatus and bridge, compile proxy x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rxExe = Join-Path $env:RUNNER_TEMP 'virtualcar-dev26-rx-status.exe'
          $bridgeExe = Join-Path $env:RUNNER_TEMP 'virtualcar-dev26-bridge.exe'
          $proxyObj = Join-Path $env:RUNNER_TEMP 'virtualcar-dev26-x86-proxy.obj'
          $bridgeObj = Join-Path $env:RUNNER_TEMP 'virtualcar-dev26-x86-bridge.obj'
          # Unit test uses current checked-out source, including RxStatus bits
          # and failed PassThruReadMsgs stale-buffer suppression.
          & clang -std=c99 -O2 -Werror -Wall -Wextra -pedantic -Iproxy tests/test_rx_status.c -o $rxExe
          if ($LASTEXITCODE -ne 0) { throw 'Native root RxStatus test compilation failed' }
          & $rxExe
          if ($LASTEXITCODE -ne 0) { throw 'Native root RxStatus test failed' }

          & clang -std=c99 -O2 -Werror -Wall -Wextra -pedantic -Iproxy `
            proxy/p2_cem_router.c proxy/p2_ls_observer.c proxy/p2_vehicle_core.c `
            proxy/p2_j2534_bridge.c tests/test_bridge.c -o $bridgeExe
          if ($LASTEXITCODE -ne 0) { throw 'Native root bridge test compilation failed' }
          & $bridgeExe
          if ($LASTEXITCODE -ne 0) { throw 'Native root bridge test failed' }

          # Compilation checks x86 ABI/C99, not a full DLL link or client run.
          & clang -target i686-pc-windows-msvc -fno-builtin -fno-stack-protector `
            -ffreestanding -Werror -Wall -Wextra -c proxy/j2534_trace_proxy.c -o $proxyObj
          if ($LASTEXITCODE -ne 0) { throw 'Native root proxy Windows x86 compilation failed' }
          & clang -target i686-pc-windows-msvc -fno-builtin -fno-stack-protector `
            -ffreestanding -Werror -Wall -Wextra -c proxy/p2_j2534_bridge.c -o $bridgeObj
          if ($LASTEXITCODE -ne 0) { throw 'Native root bridge Windows x86 compilation failed' }
          & llvm-readobj --file-headers $proxyObj
          if ($LASTEXITCODE -ne 0) { throw 'Native root proxy COFF inspection failed' }

      - name: Link and verify root dev26 Windows x86 J2534 DLL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # This invokes the SAME native compilation/linking code used by the
          # canonical build_dev26.sh, but does not build Go assets or OneClick.
          & bash -n ./build_dev26.sh
          if ($LASTEXITCODE -ne 0) { throw 'Native root build script syntax failed' }
          & bash ./build_dev26.sh --native-only
          if ($LASTEXITCODE -ne 0) { throw 'Native root J2534 DLL link failed' }
          $dll = Join-Path $env:GITHUB_WORKSPACE 'cmd/oneclick/assets/VirtualCarTrace32.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw 'Root VirtualCarTrace32.dll was not produced'
          }
          & llvm-readobj --file-headers --coff-exports $dll
          if ($LASTEXITCODE -ne 0) { throw 'Root x86 PE inspection failed' }
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python emulator/native-cpp/tests/verify_pe_exports.py $dll Win32
          if ($LASTEXITCODE -ne 0) { throw 'Root DLL PE32/14 J2534 exports verification failed' }
          Write-Host 'PASS: root VirtualCarTrace32.dll linked for Windows x86 with exactly 14 J2534 exports'
          Write-Host 'No DLL registration, load, hardware access, artifact upload or release.'

      - name: Run legacy C protocol regression with Clang host compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testExe = Join-Path $env:RUNNER_TEMP 'virtualcar-c-host-tests.exe'
          $env:VIRTUALCAR_ROUTE_EVIDENCE = Join-Path $env:RUNNER_TEMP 'virtualcar-c-host-route-evidence.jsonl'
          clang -std=c11 -O2 -Wall -Wextra -D_CRT_SECURE_NO_WARNINGS -o $testExe emulator/tests/virtualcar_test.c emulator/src/p2core/p2_cem_router.c emulator/src/p2core/p2_ls_observer.c emulator/src/p2core/p2_vehicle_core.c emulator/src/p2core/p2_j2534_bridge.c
          if ($LASTEXITCODE -ne 0) { throw 'Legacy C host regression compilation failed' }
          & $testExe
          if ($LASTEXITCODE -ne 0) { throw 'Legacy C host regression failed' }

      - name: Cross-build legacy J2534 C DLL for Windows x86 with Clang and LLD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location emulator
          try {
            & bash ./build-cross.sh
            if ($LASTEXITCODE -ne 0) { throw 'Clang/LLD Windows x86 legacy DLL build failed' }
          } finally {
            Pop-Location
          }
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'Legacy x86 J2534 DLL was not produced' }
          llvm-readobj --coff-exports $dll
          if ($LASTEXITCODE -ne 0) { throw 'LLVM could not inspect the legacy x86 DLL export table' }
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python emulator/native-cpp/tests/verify_pe_exports.py $dll Win32
          if ($LASTEXITCODE -ne 0) { throw 'Legacy x86 DLL PE architecture/export verification failed' }

      - name: Run legacy C x86 DLL native route regression and evidence audit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $routeDir = Join-Path $env:RUNNER_TEMP 'virtualcar-native-route-regression'
          $audit = Join-Path $env:RUNNER_TEMP 'virtualcar-native-route-audit.json'
          if (Test-Path -LiteralPath $routeDir) { throw 'Refusing to reuse native route regression directory' }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll -OutputDirectory $routeDir
          if ($LASTEXITCODE -ne 0) { throw 'Legacy x86 DLL native route regression failed' }
          $evidence = Join-Path $routeDir 'VirtualCar\dev47-backend.jsonl'
          if (-not (Test-Path -LiteralPath $evidence)) { throw 'Native route regression evidence is missing' }
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python emulator/tools/verify_native_routes.py $evidence --output $audit
          if ($LASTEXITCODE -ne 0) { throw 'Native route evidence audit failed' }

          # Separate fresh process and INI: the negative/no-fixture auditor above
          # must remain unchanged. This is SYNTHETIC wire fidelity, not VIDA VIN
          # acceptance or proof of OEM XC90 identity.
          $identityDir = Join-Path $env:RUNNER_TEMP 'virtualcar-native-synthetic-identity'
          if (Test-Path -LiteralPath $identityDir) {
            throw 'Refusing to reuse native synthetic identity directory'
          }
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll -OutputDirectory $identityDir -IdentityReplay
          if ($LASTEXITCODE -ne 0) {
            throw 'Native x86 synthetic CEM B9FB/ECM F190 wire verification failed'
          }
          Write-Host 'PASS: native x86 synthetic 13-frame D2 and ISO15765 ECM F190 wire'
          
      # CEM50 owner's published synthetic reference profile: exact x86 CAN/D2 RX.
      # Only runs after a trusted development push on the persistent VMware runner.
      # Never install/register a provider, run original VIDA or contact physical ECU.
      - name: Verify exact CEM50 B9FB 13-frame native x86 replay
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_REF -cne 'refs/heads/development') {
            throw 'CEM50 native smoke requires trusted development push'
          }
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw 'Trusted development x86 J2534 DLL not built'
          }
          $sha = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $out = Join-Path $root ('cem50-exact-native-' + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $out) { throw 'Exclusive CEM50 smoke output already exists' }
          try {
            & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File emulator/adapters/cem50/Verify-J2534CEM50.ps1 -DllPath $dll -ExpectedSha256 $sha -OutputDirectory $out
            if ($LASTEXITCODE -ne 0) { throw 'CEM50 native x86 B9FB 13-frame smoke failed' }
            $reportPath = Join-Path $out 'native-check.json'
            if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              throw 'CEM50 native smoke JSON missing'
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            if ($report.status -cne 'CEM50_NATIVE_PASS' -or
                [int]$report.actual_matched_frame_count -ne 13 -or
                $report.published_vin -cne 'YV1CR855691511566' -or
                $report.vida_readvin_verified -ne $false -or
                $report.physical_adapter_used -ne $false) {
              throw 'CEM50 native report does not match expected read-only evidence'
            }
            Write-Host 'PASS: x86 native CEM50 B9FB 13/13 synthetic RX, no VIDA/ECU acceptance claim'
          } finally {
            # Persistent runner: delete only this new direct child of RUNNER_TEMP.
            $parent = [IO.Path]::GetFullPath((Split-Path -Parent $out)).TrimEnd('\')
            if (-not [String]::Equals($parent,$root,[StringComparison]::OrdinalIgnoreCase)) {
              throw 'CEM50 native cleanup path escaped RUNNER_TEMP'
            }
            if (Test-Path -LiteralPath $out -PathType Container) {
              Remove-Item -LiteralPath $out -Recurse -Force
            }
          }

      # B3A331: owner-independent, read-only source-shaped VIDA CAN-MS
      # channel lifecycle. Built x86 virtual DLL only. No original VIDA, CAN TX,
      # physical J2534, provider registry modification or accepted VIN claim.
      - name: Check native x86 VIDA-shaped CAN-MS J2534-2 channel lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $probeDir = Join-Path $root ('virtualcar-b3a331-' + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $probeDir) {
            throw 'Refusing to reuse a CAN-MS preflight directory'
          }
          try {
            & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File emulator/tools/verify_native_routes.ps1 -DllPath $dll -OutputDirectory $probeDir -CanMsPreflight
            if ($LASTEXITCODE -ne 0) {
              throw 'Synthetic x86 CAN-MS channel lifecycle preflight failed'
            }
          } finally {
            # The runner is persistent: remove only the unique direct child
            # of RUNNER_TEMP created by this CI step.
            $parent = [IO.Path]::GetFullPath((Split-Path -Parent $probeDir)).TrimEnd('\')
            if (-not [String]::Equals($parent, $root,
                    [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Refusing CAN-MS cleanup outside RUNNER_TEMP'
            }
            if (Test-Path -LiteralPath $probeDir -PathType Container) {
              Remove-Item -LiteralPath $probeDir -Recurse -Force
            }
          }

      # B3A325: exercise the actual just-built x86 emulator DLL from four
      # isolated synthetic host processes writing the same temporary trace.
      # Unlike the host shim, this validates real Win32 multi-process append.
      # No provider registration, physical CAN, original VIDA or client run.
      - name: Stress native x86 J2534 logger append across four isolated processes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $script = 'emulator/tools/test_native_log_multiprocess_append.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -DllPath $dll -Workers 4 -Iterations 16
          if ($LASTEXITCODE -ne 0) {
            throw 'Native x86 multi-process append test failed'
          }

      # B3A330: same native x86 DLL, four simultaneous isolated producers
      # of synthetic 13-frame D2 B9FB. Distinguish source protocol metadata
      # and append fidelity from original VIDA/SectorV ECU acceptance.
      - name: Stress native x86 D2 RX context and tags across four processes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $script = 'emulator/tools/test_native_log_multiprocess_append.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -DllPath $dll -Workers 4 -Iterations 2 -D2Replay
          if ($LASTEXITCODE -ne 0) {
            throw 'Native x86 synthetic multi-process D2 metadata regression failed'
          }

      # Read-only provenance probe: inspect canonical J2534 registry32 metadata
      # on THIS CI runner only. No DLL load or diagnostic-client execution;
      # the runner may be different from the SectorV GUI test guest.
      - name: Audit installed canonical J2534 provider against tested x86 DLL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw 'Built legacy x86 J2534 DLL missing for provenance audit'
          }
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          & $python emulator/tools/audit_vmware_provider_provenance.py --built-dll $dll
          if ($LASTEXITCODE -ne 0) { throw 'Read-only J2534 provider metadata audit failed' }
          Write-Host 'Provider status describes this CI runner only; no SectorV client was launched.'

      # Evidence only: see whether a name-matched SectorV process is running
      # in the CI runner's visible process context and whether it lists the
      # canonical registered J2534 DLL among loaded modules. This NEVER
      # starts the client, opens CAN, modifies HKLM, or proves GUI acceptance.
      - name: Snapshot SectorV process and registered J2534 DLL binding read-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = 'emulator/tools/audit_vmware_sectorv_process.ps1'
          $ps = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $ps -NoProfile -ExecutionPolicy Bypass -File $probe -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'SectorV process binding self-tests failed' }
          & $ps -NoProfile -ExecutionPolicy Bypass -File $probe
          if ($LASTEXITCODE -ne 0) { throw 'Read-only SectorV process snapshot failed' }
          Write-Host 'Snapshot is scoped to CI runner only, never equate with prior GUI session.'

      - name: Run Go control tests and vet
        shell: powershell
        working-directory: emulator/control
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Go control tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }

      # Inspect real x86 outputs in a private temporary package only.
      # The script does not run the GUI or upload/publish binaries.
      - name: Verify locally built x86 VMware LAB package without publishing
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File emulator/tools/verify_local_vmware_lab_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Local x86 LAB ZIP verification failed' }
      - name: Configure and build native C++ x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE '.ci-build\native-x86'
          cmake -S emulator/native-cpp -B $buildDir -G 'Visual Studio 17 2022' -A Win32
          if ($LASTEXITCODE -ne 0) { throw 'CMake x86 configuration failed' }
          cmake --build $buildDir --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'C++ x86 build failed' }
          ctest --test-dir $buildDir -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++ x86 CTest suite failed' }
          $parityExe = Join-Path $buildDir 'Release\vc_legacy_c_cpp_parity.exe'
          $legacyDll = Join-Path $env:GITHUB_WORKSPACE 'emulator\VirtualCarJ2534.dll'
          $parityDir = Join-Path $env:RUNNER_TEMP 'virtualcar-m4b2-native-parity'
          if (-not (Test-Path -LiteralPath $legacyDll)) { throw 'Independently built legacy C x86 DLL is missing' }
          if (-not (Test-Path -LiteralPath $parityExe)) { throw 'C/C++ parity executable is missing' }
          if (Test-Path -LiteralPath $parityDir) { throw 'Refusing to reuse C/C++ parity directory' }
          & $parityExe $legacyDll $parityDir
          if ($LASTEXITCODE -ne 0) { throw 'Actual legacy C DLL versus C++20 RX parity failed' }

      - name: Configure and build native C++ x64
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE '.ci-build\native-x64'
