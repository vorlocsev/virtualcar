name: VC116 native warning audit
on:
  push:
    branches:
      - 'vc111-build/20261126'
    paths:
      - '.github/workflows/vc111-vmware-build.yml'
      - 'vc111-build/vc115.cpp'
permissions:
  contents: read
concurrency:
  group: virtualcar-vmware-development-validation
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'vorlocsev/virtualcar' && github.actor == 'vorlocsev' && github.event_name == 'push' && github.ref == 'refs/heads/vc111-build/20261126'
    runs-on: [self-hosted, Windows, X64, virtualcar-win]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile x86 J2534 and native Win32
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'b5671a5f0662d9be75e66314fb7968b2cca61a81'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'vc111-build\vc110-source.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '0B573DF8E710FDC96394153E17D4D31CCA60D04533FF0383F119B87DBB29E951') { throw 'VC108 source archive hash mismatch' }
          $work = Join-Path $env:RUNNER_TEMP ("vc116-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $work) { throw 'Refusing reused build directory' }
          New-Item -ItemType Directory -Path $work | Out-Null
          $proto = Join-Path $work 'proto'
          $repo = Join-Path $work 'base'
          $candidate = Join-Path $work 'candidate'
          $python = (Get-Content -LiteralPath 'E:\VirtualCar\Tools\python312.path' -Raw).Trim()
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Runner Python missing' }
          $env:VC108_PYTHON = $python
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python failed' }
          Expand-Archive -LiteralPath $archive -DestinationPath $proto
          & $python (Join-Path $env:GITHUB_WORKSPACE 'vc111-build\no-session.py') $proto
          if ($LASTEXITCODE -ne 0) { throw 'VC114 no-session staging failed' }
          git clone --local --no-hardlinks --no-checkout $env:GITHUB_WORKSPACE $repo
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          git -C $repo -c core.autocrlf=false checkout --detach $base
          if ($LASTEXITCODE -ne 0) { throw 'Base checkout failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not available on runner' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64'
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x86') { throw 'Incorrect target architecture' }
          if (-not (Get-Command clang-cl.exe -ErrorAction SilentlyContinue)) {
            foreach ($bin in @((Join-Path $vs 'VC\Tools\Llvm\x64\bin'),(Join-Path $env:ProgramFiles 'LLVM\bin'))) {
              if (Test-Path -LiteralPath (Join-Path $bin 'clang-cl.exe')) { $env:PATH = "$bin;$env:PATH"; break }
            }
          }
          # Reuse the proven native prefix of VC114, stop before the WinUI seal/publish.
          $build = Join-Path $proto 'acceptance\build-only.ps1'
          $lines = @(Get-Content -LiteralPath $build)
          $hits = @(for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match 'seal_provider\.py'){ $i }})
          if ($hits.Count -ne 1 -or $hits[0] -lt 1) { throw 'Native build prefix anchor mismatch' }
          $prefix = @($lines[0..($hits[0]-1)])
          if (-not (($prefix -join "`n") -match 'audit_pe\.py')) { throw 'PE audit must precede seal' }
          $nativeBuild = Join-Path $proto 'acceptance\build-native-only.ps1'
          [IO.File]::WriteAllLines($nativeBuild,[string[]]$prefix,(New-Object Text.UTF8Encoding($false)))
          & $nativeBuild -Checkout $repo -Output $candidate -Python $python
          $dll = Join-Path $candidate 'provider\VirtualCarJ2534.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'Missing DLL' }
          $package = Join-Path $work 'package'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item -LiteralPath $dll -Destination $package
          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          ('#define VC115_PROVIDER_SHA L"'+$hash+'"') | Set-Content -LiteralPath (Join-Path $work 'provider_hash.h') -Encoding ASCII
          $source = Join-Path $env:GITHUB_WORKSPACE 'vc111-build\vc115.cpp'
          $out = Join-Path $package 'VirtualCar.exe'
          & cl.exe /nologo /std:c++17 /EHsc /O1 /GL /MT /W4 /WX /utf-8 "/I$work" "/Fo$work\vc115.obj" $source /link /LTCG /OPT:REF /OPT:ICF /SUBSYSTEM:WINDOWS /MACHINE:X86 /DYNAMICBASE /NXCOMPAT "/OUT:$out"
          if ($LASTEXITCODE -ne 0) { throw 'Native C++ compile/link failed' }
          $dump = (& dumpbin.exe /headers /imports $out | Out-String)
          if ($LASTEXITCODE -ne 0 -or $dump -notmatch '14C machine \(x86\)' -or $dump -match '(?im)^\s*(mscoree|vcruntime[^ ]*|msvcp[^ ]*|python[^ ]*|Microsoft\.UI\.Xaml)\.dll\s*$') { throw 'Native PE architecture/import check failed' }
          $dump | Write-Host
          Write-Host "VC116_NATIVE_PE=PASS x86 static CRT /W4 /WX"
          @(
            'VC116 native C++ Win32 x86 development candidate',
            "Base: $base", "Build commit: $env:GITHUB_SHA",
            "Provider SHA256: $hash",
            'Portable package; no Python, .NET or Windows App SDK required at runtime.',
            'Existing VC107 registration only; expected path C:\VC099-VIDA-511\provider\VirtualCarJ2534.dll.',
            'Close all diagnostic clients before clicking Connect to VIDA or Restore previous driver.',
            'Keep this directory intact while the driver is selected. No working INI is included.',
            'Compile and PE audit only; GUI, registry switch, rollback and VIDA NOT TESTED.'
          ) | Set-Content -LiteralPath (Join-Path $package 'BUILD-INFO.txt') -Encoding UTF8
          Get-ChildItem -LiteralPath $package -Recurse -File | Sort-Object FullName | ForEach-Object {
            ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash + '  ' + $_.FullName.Substring($package.Length+1))
          } | Set-Content -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding UTF8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $work 'VirtualCar-VC116-native.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($package,$zip)
          Get-FileHash -LiteralPath $zip -Algorithm SHA256
          $saved = Join-Path 'E:\VirtualCar\Builds' ("VC116-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $saved) { throw 'Refusing to overwrite previous package' }
          New-Item -ItemType Directory -Path $saved -Force | Out-Null
          Copy-Item -LiteralPath $zip -Destination $saved
          Write-Host ('VC116_VMWARE_BUILD=' + (Join-Path $saved 'VirtualCar-VC116-native.zip'))
      - name: Upload compiled candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VirtualCar-VC116-native
          path: ${{ runner.temp }}/vc116-${{ github.run_id }}-${{ github.run_attempt }}/VirtualCar-VC116-native.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
